# Toolathlon Harbor Registry Entry
# This file defines how Toolathlon is registered with Harbor's dataset registry

name: toolathlon
description: |
  Toolathlon is a benchmark for evaluating language agents' tool use capabilities.
  It features 600+ diverse tools across realistic software environments (Canvas LMS,
  GitHub, Google Suite, email, etc.) with 110+ long-horizon tasks requiring
  multi-step tool calls.

versions:
  "1.0":
    # Tasks are generated by the adapter from the Toolathlon repository
    path: "./harbor_tasks"  # Path to generated Harbor tasks
    metrics:
      - type: mean
        name: "pass_rate"

# Alternative: Use git repository directly
# versions:
#   "1.0":
#     git_url: "https://github.com/yourorg/toolathlon-harbor-tasks.git"
#     git_ref: "main"

# Required environment variables for Toolathlon tasks
required_env_vars:
  # Google Cloud
  - GOOGLE_CLIENT_ID
  - GOOGLE_CLIENT_SECRET
  - GOOGLE_REFRESH_TOKEN
  - GCP_PROJECT_ID
  - GCP_SERVICE_ACCOUNT_PATH

  # GitHub
  - GITHUB_TOKEN

  # Canvas LMS
  - CANVAS_API_TOKEN
  - CANVAS_DOMAIN

  # Email (Poste)
  - EMAILS_CONFIG_FILE

  # Notion
  - NOTION_INTEGRATION_KEY

  # Snowflake
  - SNOWFLAKE_ACCOUNT
  - SNOWFLAKE_USER
  - SNOWFLAKE_PRIVATE_KEY_PATH

  # WandB
  - WANDB_API_KEY

  # Huggingface
  - HUGGINGFACE_TOKEN

# External services that must be running
external_services:
  - name: "Canvas LMS"
    description: "Learning management system for education tasks"
    default_endpoint: "http://localhost:20001"

  - name: "Poste.io"
    description: "Email server for email-related tasks"
    default_endpoint: "http://localhost:10081"

  - name: "WooCommerce"
    description: "E-commerce platform for shopping tasks"
    default_endpoint: "http://localhost:10003"

# Docker configuration
docker:
  base_image: "ghcr.io/toolathlon/toolathlon-base:latest"
  build_context: "./docker"
